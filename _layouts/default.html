<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.title %}{{ page.title }} · {% endif %}Snefjellå Research</title>
<link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Mulish:ital,wght@0,300;0,400;0,600;1,300&display=swap">
<style>
  /* DESIGN FILE: shared by every page. Content lives in index.html and _posts/. */
  :root{
    --bg:#FFFFFF; --band:#F1F2F0; --ink:#1E1F21; --muted:#5E6266; --line:#E2E3E0;
    --chip:#2A2B2D; --chip-ink:#FFFFFF; --foot:#1F2022; --foot-ink:#B7BABC;
    --font-head:'Jost','Futura','Century Gothic',system-ui,sans-serif;
    --font-body:'Mulish','Segoe UI',system-ui,-apple-system,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-weight:400; font-size:16px; line-height:1.7; -webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:1080px; margin:0 auto; padding-left:max(20px,env(safe-area-inset-left,0px)); padding-right:max(20px,env(safe-area-inset-right,0px))}
  .narrow{max-width:760px}

  header{background:var(--band); border-bottom:1px solid var(--line); position:sticky; top:env(safe-area-inset-top,0px); z-index:5}
  body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--band)}
  .bar{display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap; padding-block:18px}
  /* Wordmark: used everywhere the name appears (header, front page, footer) */
  .mark, .wm{display:flex; align-items:baseline; gap:10px; text-decoration:none; min-width:0; margin:0; flex-wrap:wrap}
  .wm{justify-content:center}
  .mark b, .wm b{font-family:var(--font-head); font-weight:600; font-size:26px; letter-spacing:.06em; text-transform:uppercase; line-height:1}
  .mark span, .wm span{font-family:var(--font-head); font-weight:400; font-size:13px; letter-spacing:.32em; text-transform:uppercase; color:var(--muted)}
  footer .wm{justify-content:flex-start}
  footer .wm b{color:#FFFFFF}
  footer .wm span{color:var(--foot-ink)}
  section, [id]{scroll-margin-top:84px}
  nav{display:flex; gap:26px; flex-wrap:wrap}
  nav a{font-family:var(--font-head); font-size:13px; font-weight:500; letter-spacing:.16em; text-transform:uppercase; text-decoration:none; color:var(--muted); padding-block:4px; border-bottom:1px solid transparent}
  nav a:hover{color:var(--ink); border-color:var(--ink)}

  /* Hero: the mountain drawing keeps its own proportions, so the snow caps always show */
  .hero{position:relative; overflow:hidden; background:linear-gradient(180deg,#ECEDEB 0%,#D9DBD9 55%,#C9CBC9 100%)}
  .hero svg{position:absolute; left:0; right:0; bottom:0; width:100%; height:29.17vw; display:block}
  .hero .wrap{position:relative; min-height:max(440px, calc(29.17vw + 190px)); display:flex; flex-direction:column; align-items:flex-end; text-align:right; padding-block:64px 150px}
  .hero h1{font-family:var(--font-head); font-weight:500; text-transform:uppercase; letter-spacing:.04em; font-size:clamp(26px,4.2vw,40px); line-height:1.2; margin:0; max-width:20ch; text-wrap:balance}
  .chip{display:inline-block; margin-top:18px; background:var(--chip); color:var(--chip-ink); font-family:var(--font-head); font-size:13px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; text-decoration:none; padding:9px 22px; border:0; cursor:pointer}
  .chip:hover{background:#000}

  section{padding-block:76px}
  section + section{border-top:1px solid var(--line)}
  .head{text-align:center; margin-bottom:34px}
  .head h2{font-family:var(--font-head); font-weight:600; font-size:clamp(26px,3.4vw,34px); letter-spacing:.06em; text-transform:uppercase; margin:0; line-height:1.15}
  .head p{margin:8px 0 0; font-family:var(--font-head); font-size:13px; letter-spacing:.24em; text-transform:uppercase; color:var(--muted)}
  .intro{text-align:center; font-weight:300; font-size:clamp(17px,2vw,19px); color:#3B3D40; margin:0 auto; max-width:62ch}
  .intro + .intro{margin-top:16px}

  .case{border:1px solid var(--line); display:grid; grid-template-columns:1.25fr 1fr}
  .case-body{padding:clamp(24px,4vw,40px); min-width:0}
  .case-side{background:var(--band); padding:clamp(24px,4vw,40px); border-left:1px solid var(--line); display:flex; flex-direction:column; gap:22px; min-width:0}
  .tag{font-family:var(--font-head); font-size:12px; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--muted)}
  .case h3{font-family:var(--font-head); font-weight:500; font-size:clamp(22px,2.6vw,28px); line-height:1.25; margin:10px 0 16px; text-wrap:balance}
  .case h3 a{text-decoration:none}
  .case p{margin:0 0 12px; color:#35373A}
  .status{display:inline-block; margin-top:8px; font-family:var(--font-head); font-size:12px; letter-spacing:.16em; text-transform:uppercase; border:1px solid var(--ink); padding:5px 12px; text-decoration:none}
  .kv{display:grid; gap:18px}
  .kv div{border-bottom:1px solid var(--line); padding-bottom:14px}
  .kv div:last-child{border-bottom:0; padding-bottom:0}
  .kv .n{font-family:var(--font-head); font-weight:500; font-size:30px; line-height:1; font-variant-numeric:tabular-nums}
  .kv .l{font-size:13.5px; color:var(--muted); margin-top:6px}
  .meta{font-size:13.5px; color:var(--muted); line-height:1.6}
  .meta b{font-family:var(--font-head); font-weight:600; letter-spacing:.08em; color:var(--ink)}

  .cov{margin-top:44px; border-top:1px solid var(--ink)}
  .row{display:grid; grid-template-columns:2fr .8fr 1fr 1fr 1fr; gap:14px; align-items:center; padding:16px 4px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums}
  .row.h{font-family:var(--font-head); font-size:11.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); padding-block:12px}
  .row .co{font-family:var(--font-head); font-weight:500; font-size:17px; letter-spacing:.02em; text-decoration:none}
  .row .dim{color:var(--muted)}
  .row .st{font-family:var(--font-head); font-size:12px; letter-spacing:.14em; text-transform:uppercase}
  .row .st.on::before{content:""; display:inline-block; width:7px; height:7px; background:var(--ink); border-radius:50%; margin-right:8px; vertical-align:1px}

  .three{display:grid; grid-template-columns:repeat(3,1fr); gap:40px}
  .three > div{text-align:center; min-width:0}
  .three .num{font-family:var(--font-head); font-size:13px; letter-spacing:.2em; color:var(--muted)}
  .three h3{font-family:var(--font-head); font-weight:600; font-size:17px; letter-spacing:.12em; text-transform:uppercase; margin:8px 0 10px}
  .three p{margin:0; font-weight:300; color:#3B3D40}

  .more{display:inline-block; margin-top:10px; font-family:var(--font-head); font-size:13px; letter-spacing:.16em; text-transform:uppercase; text-decoration:none; border-bottom:1px solid var(--ink)}
  .about{text-align:center}
  .about p{text-align:center; font-weight:300; font-size:18px; color:#3B3D40; margin:0 auto 14px; max-width:60ch}

  /* Research notes (pages made from _posts/*.md) */
  .note-head{background:var(--band); border-bottom:1px solid var(--line); padding-block:56px 44px}
  .note-head h1{font-family:var(--font-head); font-weight:500; font-size:clamp(28px,4vw,42px); line-height:1.15; margin:10px 0 12px; text-wrap:balance}
  .note-head .sub{font-weight:300; font-size:19px; color:#3B3D40; margin:0 0 18px}
  .note-meta{font-family:var(--font-head); font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
  .prose{padding-block:48px 80px}
  .prose h2{font-family:var(--font-head); font-weight:600; font-size:22px; letter-spacing:.06em; text-transform:uppercase; margin:52px 0 14px; padding-top:22px; border-top:1px solid var(--line)}
  .prose h3{font-family:var(--font-head); font-weight:600; font-size:17px; letter-spacing:.04em; margin:30px 0 8px}
  .prose p, .prose li{color:#2E3033}
  .prose a{text-underline-offset:3px}
  .prose blockquote{margin:24px 0; padding:4px 0 4px 20px; border-left:3px solid var(--ink); font-weight:300; font-size:18px}
  .prose table{display:block; overflow-x:auto; border-collapse:collapse; margin:20px 0; font-size:14.5px; font-variant-numeric:tabular-nums; max-width:100%}
  .prose th{font-family:var(--font-head); font-weight:500; font-size:12px; letter-spacing:.12em; text-transform:uppercase; text-align:left; color:var(--muted); border-bottom:1px solid var(--ink); padding:8px 14px 8px 0; white-space:nowrap}
  .prose td{border-bottom:1px solid var(--line); padding:9px 14px 9px 0; vertical-align:top}
  .prose img{max-width:100%; height:auto; border:1px solid var(--line)}
  .prose hr{border:0; border-top:1px solid var(--line); margin:40px 0}
  .prose code{font-size:.92em; background:var(--band); padding:1px 5px}
  .glance{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); margin:0 0 8px}
  .glance div{background:var(--bg); padding:14px 16px; min-width:0}
  .glance .k{font-family:var(--font-head); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted)}
  .glance .v{font-family:var(--font-head); font-weight:500; font-size:20px; margin-top:4px; font-variant-numeric:tabular-nums; line-height:1.25}
  .back{display:inline-block; margin-top:36px; font-family:var(--font-head); font-size:13px; letter-spacing:.16em; text-transform:uppercase; text-decoration:none; border-bottom:1px solid var(--ink)}

  footer{background:var(--foot); color:var(--foot-ink)}
  footer .wrap{padding-block:40px; display:flex; justify-content:space-between; gap:24px; flex-wrap:wrap}
  footer p{margin:0; font-size:13px; line-height:1.7; max-width:56ch}

  :focus-visible{outline:2px solid var(--ink); outline-offset:3px}
  @media (max-width:820px){
    .case{grid-template-columns:1fr}
    .case-side{border-left:0; border-top:1px solid var(--line)}
    .three{grid-template-columns:1fr; gap:34px}
  }
  @media (max-width:560px){
    .hero svg{height:230px}
    .hero .wrap{align-items:flex-start; text-align:left; min-height:400px; padding-block:44px 150px}
    .row{grid-template-columns:1.4fr 1fr}
    .row .hide-s{display:none}
    .glance{grid-template-columns:repeat(2,1fr)}
    nav{gap:18px}
    .mark b, .wm b{font-size:22px}
    section{padding-block:56px}
  }
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="mark" href="{{ '/' | relative_url }}" aria-label="Snefjellå Research, home"><b>Snefjellå</b><span>Research</span></a>
    <nav aria-label="Main">
      <a href="{{ '/#research' | relative_url }}">Research</a>
      <a href="{{ '/#approach' | relative_url }}">Approach</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
    </nav>
  </div>
</header>

<main id="top">
{{ content }}
</main>

<footer>
  <div class="wrap">
    <div class="wm"><b>Snefjellå</b><span>Research</span></div>
    <p>Independent research published in a personal capacity. Views are my own and not investment advice. © {{ 'now' | date: '%Y' }} Snefjellå Research</p>
  </div>
</footer>

<script>
  /* Always open at the top; menu links scroll without leaving #section in the address */
  (function(){
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    document.addEventListener('click', function(e){
      var a = e.target.closest('a[href*="#"]'); if (!a) return;
      var u = new URL(a.href, location.href);
      if (u.pathname !== location.pathname) return;
      var el = document.getElementById(u.hash.slice(1)); if (!el) return;
      e.preventDefault(); el.scrollIntoView({behavior:'smooth'});
    });
    window.addEventListener('load', function(){
      if (location.hash) {
        var el = document.getElementById(location.hash.slice(1));
        if (el) el.scrollIntoView();
        history.replaceState(null, '', location.pathname + location.search);
      } else { window.scrollTo(0, 0); }
    });
  })();
</script>

</body>
</html>
